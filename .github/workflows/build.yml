name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler/Gradle errors as annotations (readable without the full log)
          grep -E "^e: |error:|What went wrong|Could not|> " build.log | grep -v "^> Task" | head -60 > errs.txt || true
          split -l 6 errs.txt chunk_ || true
          for f in chunk_*; do
            msg=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$msg"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HealthHub.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Health Hub build ${{ github.run_number }}
          make_latest: true
          body: |
            Open this page on your phone and tap **HealthHub.apk** to install.
            Built from ${{ github.sha }}.
          files: HealthHub.apk
